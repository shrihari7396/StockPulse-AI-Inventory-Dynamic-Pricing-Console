version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      # Load environment variables from .env file
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_HEADER_PRODUCT=${LLM_HEADER_PRODUCT}
      - LLM_HEADER_COOKIE=${LLM_HEADER_COOKIE}
    env_file:
      - .env
    networks:
      - stockpulse-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    networks:
      - stockpulse-network

networks:
  stockpulse-network:
    driver: bridge
