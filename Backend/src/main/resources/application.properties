# Server Configuration
server.port=8080

# Primary In-Memory H2 Database (Zero-configuration instant boot for hackathon & evaluators)
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# LLM Gateway Settings (Addendum B)
# Providers: gemini, groq, ollama
llm.provider=gemini
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-1.5-flash
llm.base-url=https://generativelanguage.googleapis.com

# StockPulse Commerce & Agentic Trigger Configuration
stockpulse.strategy.pricing=RULE_BASED
stockpulse.strategy.reorder=RULE_BASED
# A spike is triggered if product velocity is >= multiplier * category average OR >= absolute threshold
stockpulse.triggers.demand-spike-multiplier=2.5
stockpulse.triggers.demand-spike-absolute-threshold=10

# Logging
logging.level.org.zycus=INFO
