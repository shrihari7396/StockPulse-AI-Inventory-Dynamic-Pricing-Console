# MySQL Profile Configuration for StockPulse
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# LLM Gateway Settings
llm.provider=${LLM_PROVIDER:litellm}
llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:qwen-cursor}
llm.header.product=${LLM_HEADER_PRODUCT:PC1}
llm.header.cookie=${LLM_HEADER_COOKIE:}

# StockPulse Commerce & Agentic Thresholds
stockpulse.strategy.pricing=RULE_BASED
stockpulse.strategy.reorder=RULE_BASED
stockpulse.triggers.demand-spike-multiplier=2.5
stockpulse.triggers.demand-spike-absolute-threshold=10
